# XcodeGen project spec — run `xcodegen generate` in this directory on a Mac
# to produce Screenshot2Cal.xcodeproj (never committed). See
# docs/setup-apple.md for the full walkthrough, including the values to
# substitute for DEVELOPMENT_TEAM and the CloudFront domain.
name: Screenshot2Cal
options:
  bundleIdPrefix: digital.callaeas
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: HJ33GW58G8
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 9.2.0

targets:
  Screenshot2Cal:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
      # The official branded SwiftUI "Sign in with Google" button (same package,
      # separate product) — Google's branding guidelines require their button.
      - package: GoogleSignIn
        product: GoogleSignInSwift
      - target: ShareExtension
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups:
          - group.digital.callaeas.s2c
        com.apple.developer.associated-domains:
          - applinks:d1n6hy34w2a6gq.cloudfront.net
        keychain-access-groups:
          - $(AppIdentifierPrefix)digital.callaeas.s2c.shared
    info:
      path: App/Info.plist
      properties:
        # Exposes the team-identifier prefix at runtime so KeychainStore can build
        # the correctly-prefixed keychain access group (else the JWT never persists).
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        # Only exempt encryption (HTTPS + Keychain, both OS-provided) — declare it
        # so App Store Connect skips the export-compliance prompt on every upload.
        ITSAppUsesNonExemptEncryption: false
        # Wire the bundle version to the build settings so bumping
        # CURRENT_PROJECT_VERSION / MARKETING_VERSION actually changes the built
        # app. Without these, XcodeGen hardcodes CFBundleVersion "1" in the plist
        # and every archive comes out build 1 regardless of the build setting.
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Screenshot to Calendar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Paste the *iOS* OAuth client id from Google Cloud console:
        GIDClientID: 907447794937-uq3mpclcbo673ojt653ntjdarl2g2dmv.apps.googleusercontent.com
        # Paste the *web* OAuth client id — required for serverAuthCode:
        GIDServerClientID: 907447794937-uvs008f9lkvjai2d0l57puhaoldkmhs2.apps.googleusercontent.com
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              # The reversed iOS client id, e.g. com.googleusercontent.apps.1234-abc
              - com.googleusercontent.apps.907447794937-uq3mpclcbo673ojt653ntjdarl2g2dmv
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: digital.callaeas.s2c
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone-only; a portrait-only app can't ship universal (App Store error 90474).
        TARGETED_DEVICE_FAMILY: "1"

  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    entitlements:
      path: ShareExtension/ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.digital.callaeas.s2c
        keychain-access-groups:
          - $(AppIdentifierPrefix)digital.callaeas.s2c.shared
    info:
      path: ShareExtension/Info.plist
      properties:
        # Same as the app target: KeychainStore (shared) needs the prefix at runtime.
        AppIdentifierPrefix: "$(AppIdentifierPrefix)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleDisplayName: Capture Event
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: digital.callaeas.s2c.share
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "3"
        TARGETED_DEVICE_FAMILY: "1"

  # Unit tests (Swift Testing) for the app's Foundation-only logic, run
  # natively on the Mac by `just ios-test` and the ios-build PR check. The
  # files under test are compiled straight into the bundle, so it needs no
  # host app, no simulator, no GoogleSignIn and no app launch. A test that
  # needs another file adds it to sources. That file must stay Foundation-only:
  # `import UIKit` or `import GoogleSignIn` fails this target's build, but
  # `import SwiftUI` would not (SwiftUI exists on macOS), so review catches that.
  # No MARKETING_VERSION here: `just ship-ios` reads every MARKETING_VERSION in
  # this file and stops unless they all agree.
  Screenshot2CalTests:
    type: bundle.unit-test
    platform: macOS
    # Without it the target takes the SDK's macOS version (27.0 under Xcode
    # 27), and the bundle then fails to load on an older Mac.
    deploymentTarget: "14.0"
    sources:
      - Tests
      - App/EventSections.swift
      - Shared/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: digital.callaeas.s2c.tests
        GENERATE_INFOPLIST_FILE: YES
        # Ad hoc ("Sign to Run Locally"), so Cmd-U on My Mac works without an
        # Apple Development certificate for the team.
        CODE_SIGN_IDENTITY: "-"

# Explicit shared schemes. Without them, XcodeGen generates no shared scheme
# and Xcode auto-creates only the extension's on open — so after any
# `xcodegen generate` the app scheme disappears and only the extension can be
# archived. Defining them here makes both persist across regenerations.
# Screenshot2Cal is the app scheme that Xcode Cloud archives. It does not
# build the tests. Screenshot2CalTests runs the unit tests: in Xcode, choose
# it with My Mac as the destination and press Cmd-U.
schemes:
  Screenshot2Cal:
    build:
      targets:
        Screenshot2Cal: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  Screenshot2CalTests:
    build:
      targets:
        Screenshot2CalTests: [test]
    test:
      config: Debug
      targets:
        - Screenshot2CalTests
      # Exact strings in the tests are en_GB ("Sun 18 Oct"). The device zone is
      # pinned far from London, so a "today" or a wire-date parse taken from the
      # device zone fails the tests. A display formatter that loses its GMT zone
      # does not fail them: GMT midnight is the same date in Auckland. A zone
      # west of GMT catches that one, but then misses the wire parse.
      language: en
      region: GB
      environmentVariables:
        TZ: Pacific/Auckland
