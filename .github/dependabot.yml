version: 2
updates:
  - package-ecosystem: npm
    directories:
      - /backend
      - /infra
      - /evals
      - /tools/prompt-improvement
    schedule:
      interval: monthly
    # Wait 7 days before proposing a new release. Most bad or hijacked
    # releases are yanked or patched within that time.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # Minor and patch updates arrive as at most two PRs a month: runtime
    # dependencies and dev tooling. The groups leave majors out, so each
    # major arrives as its own PR and gets its own review.
    groups:
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # typescript-eslint 8.x declares TypeScript ">=4.8.4 <6.1.0", so a
      # TypeScript major breaks `npm run lint`. Bump TypeScript by hand when
      # a typescript-eslint release supports the new major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node follows the Lambda runtime (NODEJS_22_X in
      # infra/lib/backend-stack.ts) and .tool-versions. Bump all three
      # together by hand (docs/ci-cd.md).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # All action bumps in one PR.
    groups:
      github-actions:
        patterns: ["*"]
