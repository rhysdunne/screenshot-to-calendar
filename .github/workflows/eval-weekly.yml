name: Weekly eval smoke

# A small live eval (10 synthetic cases) on production's models, so drift in
# extraction quality, from model updates or accidental prompt changes, shows
# up week to week.
#
# Models: production's classify and extract models, read from DEFAULT_MODELS
# in backend/src/lib/models.ts at run time, so this follows any model change.
# The harness uses one model for both stages, so each model runs the whole
# pipeline. Read classification accuracy from the classify model's row and
# extraction scores from the extract model's row.
#
# Cost: about $0.10 a run, so under $0.50 a month. Each model runs both
# stages, so Sonnet 5 classifies as well as extracts. Over the full 82 cases
# that is about $0.80 for Sonnet 5 and $0.04 for Haiku 5.5 (evals/README.md,
# evals/reports/model-refresh-2026-10/), and 10 cases are about an eighth.
#
# Red runs: the harness exits non-zero when any case hits an API error, so a
# failed model call (a revoked key, a retired model) turns this run red. The
# report is uploaded either way.
on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'rhysdunne' }} # don't run on forks
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version-file: .tool-versions }
      - run: npm ci --prefix backend
      - run: npm ci --prefix evals
      - name: Run live smoke eval
        working-directory: evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          models=$(npx tsx --eval "import { DEFAULT_MODELS as m } from '../backend/src/lib/models.ts'; console.log([...new Set([m.classify, m.extract])].join(','))")
          # An empty --models makes the harness fall back to its own default.
          test -n "$models"
          echo "Production models: $models"
          npm run eval -- --models "$models" --dataset synthetic --limit 10 --label weekly
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: eval-report-${{ github.run_id }}
          path: evals/reports/weekly/
          if-no-files-found: warn
