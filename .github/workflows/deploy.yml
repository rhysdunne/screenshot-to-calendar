name: Deploy

# Merge to main → CI → deploy staging → pause at prod until approved in the
# Actions UI (required-reviewer rule on the prod environment). Ignored prod
# gates expire after 30 days and can be rejected in the UI.
#
# workflow_dispatch reruns the same pipeline: "redeploy staging" = dispatch and
# don't approve prod; "redeploy prod" = dispatch and approve. Prod can never
# receive a commit that didn't just deploy to staging.
#
# Paths filter: only merges that change what is deployed start the pipeline.
# iOS, evals, tools and docs merges are already checked by the PR's required
# checks and deploy nothing — each used to open a prod gate that then expired.
# Dispatch to redeploy anyway. Still deliberately no auto-approval of prod.

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - infra/**
      - .tool-versions # the Node version CI and the deploy run on
      - .github/workflows/deploy.yml
      - .github/workflows/deploy-stage.yml
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  id-token: write # GitHub OIDC → AWS role
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  staging:
    needs: ci
    uses: ./.github/workflows/deploy-stage.yml
    with: { stage: staging }

  prod:
    needs: staging
    uses: ./.github/workflows/deploy-stage.yml
    with: { stage: prod }
